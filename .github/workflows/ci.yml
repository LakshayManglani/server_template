name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Generate prisma types
        run: pnpm db:gen

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test
        env:
          # Runtime
          NODE_ENV: test
          APP_ENV: test
          # Server
          HOST: 0.0.0.0
          PORT: 3000
          CORS_ORIGINS: '*'
          # Logging
          LOG_LEVEL: silent
          # Rate limit
          RATE_LIMIT_MAX: 4
          # Duration of the time window in milliseconds
          RATE_LIMIT_TIME_WINDOW: 1000
          RATE_LIMIT_CACHE: 5000
          # Database
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/test_db'
