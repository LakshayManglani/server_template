name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.5
        ports:
          - 5433:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Generate prisma types
        run: pnpm db:gen

      - name: Migrate public schema
        run: pnpm db:deploy
        env:
          # Database
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5433/test_db'

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test
        env:
          # Runtime
          NODE_ENV: test
          APP_ENV: test
          # Server
          HOST: 0.0.0.0
          PORT: 3000
          CORS_ORIGINS: '*'
          COOKIE_SECRET: 'ci-cookie-secret-not-a-real-secret'
          # Logging
          LOG_LEVEL: silent
          # Rate limit
          RATE_LIMIT_MAX: 100
          # Duration of the time window in milliseconds
          RATE_LIMIT_TIME_WINDOW: 1000
          RATE_LIMIT_CACHE: 5000
          # Database
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5433/test_db'
          # Cloudinary
          CLOUDINARY_CLOUD_NAME: 'cloud_name'
          CLOUDINARY_API_KEY: 'api_key'
          CLOUDINARY_API_SECRET: 'api_secret'
          CLOUDINARY_FOLDER: 'folder_name'
